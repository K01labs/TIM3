[project]
name = "tim3"
version = "0.1.0"
description = "TIM3: a cross-domain benchmark for time-series foundation models on native (irregular, multi-rate) scientific data across fusion, healthcare, and climate"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core numerics + IO
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
    # Dataset backends: fusion (S3 Zarr), climate (TC PRIMED netCDF)
    "xarray>=2026.2.0",
    "zarr>=3.1.6",
    "s3fs>=2026.3.0",
    "aiohttp>=3.13.5",
    "netcdf4>=1.7.4",
    "h5netcdf>=1.8.1",
    "tcprimedapi>=1.0b0",
]

[project.scripts]
tim3 = "benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark", "models", "data"]
# The data/ package ships only the loader code and tracked metadata; the bulk
# per-domain dataset directories are fetched separately and must never end up
# in a built wheel (healthcare data is under a PhysioNet DUA).
exclude = [
    "data/fusion_data",
    "data/tcprimed_data",
    "data/healthcare_data",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]
